<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845" />
      <stop offset="50%" stop-color="#023e8a" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer golden ring / shield outline -->
  <circle cx="256" cy="230" r="165" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="256" cy="230" r="150" fill="url(#shieldGrad)" stroke="#F59E0B" stroke-width="4"/>

  <!-- Palm Tree & Liberty motif (Haitian emblem inspired) -->
  <!-- Palm trunk -->
  <path d="M256 160 Q254 230 256 270" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Palm leaves -->
  <path d="M256 160 Q210 135 180 155" stroke="#10B981" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M256 160 Q302 135 332 155" stroke="#10B981" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M256 160 Q230 115 205 125" stroke="#34D399" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M256 160 Q282 115 307 125" stroke="#34D399" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M256 160 Q256 100 256 115" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Left: Morpion 5-dots in row motif -->
  <g transform="translate(160, 220)">
    <circle cx="0" cy="0" r="12" fill="#3B82F6" stroke="#93C5FD" stroke-width="2"/>
    <circle cx="24" cy="0" r="12" fill="#EF4444" stroke="#FCA5A5" stroke-width="2"/>
    <circle cx="12" cy="18" r="10" fill="#F59E0B"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right: Domino Tile motif -->
  <g transform="translate(310, 210)">
    <rect x="-16" y="-12" width="34" height="48" rx="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <line x1="-14" y1="12" x2="16" y2="12" stroke="#64748B" stroke-width="2"/>
    <!-- Domino dots -->
    <circle cx="-6" cy="0" r="2.5" fill="#0F172A"/>
    <circle cx="6" cy="0" r="2.5" fill="#0F172A"/>
    <circle cx="0" cy="24" r="2.5" fill="#0F172A"/>
    <circle cx="-6" cy="30" r="2.5" fill="#0F172A"/>
    <circle cx="6" cy="18" r="2.5" fill="#0F172A"/>
  </g>

  <!-- Golden Stars & Banner -->
  <path d="M256 80 L260 92 L273 92 L262 100 L266 112 L256 104 L246 112 L250 100 L239 92 L252 92 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Play Ribbon & Text -->
  <rect x="76" y="380" width="360" height="74" rx="20" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" letter-spacing="3">
    LAKAY <tspan fill="#F59E0B">PLAY</tspan>
  </text>
  <text x="256" y="476" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#93C5FD" letter-spacing="4">
    AYITI • JWÈT &amp; PARYAJ
  </text>
</svg>
